version: "1"

package:
  id: io.github.leleya-x.linyaps-seal
  name: linyaps-seal
  # 玲珑包版本必须四段。这是包版本, 和 pubspec.yaml 里的应用版本是两回事,
  version: 0.0.18.0
  kind: app
  description: |
    如意玲珑应用权限管理器（基于社区项目 Linyaps-Seal 的玲珑打包版，GPLv2）。
    经宿主侧 D-Bus 助手 linyapsd 穿透读取 /var/lib/linglong/states.json。

command:
  - /opt/apps/io.github.leleya-x.linyaps-seal/files/bin/linyaps_seal

base: org.deepin.base/25.2.2


sources:
  - kind: file
    url: https://github.com/leleya-X/Linyaps-Seal/releases/download/0.0.18/linyaps-seal-0.0.18-x86_64-prebuilt.tar.gz
    digest: ffcbacfb1037fc6ac994c47472cce781fbe4a87e893e5301120e5cfa726818ca

build: |
  ./packaging/install-prebuilt.sh "$PREFIX" linglong/sources
